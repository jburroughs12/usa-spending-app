name: Refresh Solicitations Snapshot

on:
  schedule:
    # Once daily. SAM.gov's Opportunities API has a strict per-key daily
    # quota (as low as 10 requests/day), so this must stay a single
    # scheduled fetch, not something re-run casually.
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch SAM.gov opportunities snapshot
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python backend/scripts/refresh_solicitations.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/solicitations_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh solicitations snapshot [skip ci]"
            git push
          fi
